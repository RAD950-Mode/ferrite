[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ferrite's logic, apart from any hardware: messages between tasks, frequencies, keys, the SPI flash map, the decoder slot"

[features]
# The bench builds' debug commands (decision 151): the transmit test generators (`txtest`, `txsuite`), the readable
# memory map, the raw chip, GPS and Bluetooth requests between the terminal and the tasks. Off in user builds.
bench = []

[dependencies]
uafsk.workspace = true
upocsag.workspace = true
udsc.workspace = true
udsp.workspace = true
urad950.workspace = true
urtcw.workspace = true

[dev-dependencies]
miniz_oxide = "0.8"
# SAT-4: the f64 SGP4 reference our f32 port is checked against, and its OMM reader.
sgp4 = "2.4"
serde_json = "1"

[lints]
workspace = true
